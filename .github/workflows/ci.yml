
name: Lab 6 CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Start Student API
        run: |
          npm start > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/students; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/students

      - name: Install Newman
        run: npm install -g newman

      - name: Run API Tests
        run: newman run Student-API-Tests.json
